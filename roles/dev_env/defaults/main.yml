---
# 這些是預設值，可在 inventory / group_vars / host_vars 覆蓋。
# 對應原 wsl-bootstrap 的 config.ps1 開關。

# ---- 容器 runtime ----
container_runtime: podman          # 目前 role 只實作 podman 路徑
compose_shim: true                 # 裝 docker-compose 二進位 + DOCKER_HOST

# ---- Go（寫死必裝，只選版本）----
go_version: latest                 # 'latest' 查 go.dev，或 pin 如 '1.26.5'

# ---- 可選 toolchain ----
install_node: false
node_version: lts                  # nvm 認得的字串：'lts' / '22' / '22.11.0'
install_python: true               # uv
install_clients: true              # psql, redis-cli, nats

# 註：SSH key 與 git 身分不在這個 role —— 由 wsl-bootstrap 的 provision.sh 在 bring-up 就
# 備好（key 得先在才能 clone 私有 repo，屬「一台個人機」而非軟體層）。設定在 config.ps1。
