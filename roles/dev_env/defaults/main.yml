---
# 這裡只剩「**怎麼裝**」的參數，沒有「**裝不裝**」的開關 —— 後者 2026-07-28 整組移除了
# （install_go / install_python / install_build_tools / container_runtime /
# dev_env_packages）。要裝什麼由 tag 決定，入口是 `make install TAGS=<項目>`。
#
# 為什麼拿掉：本來同時有兩套選擇機制 —— 布林開關（宣告式：「這台機器的定義包含 Go」）
# 與 tag（命令式：「這次只跑這段」）。這個 repo 的定位是「協助把 Claude 開發環境準備
# 起來」，其他工具都是**用到時再決定裝哪一個**，那就是純命令式，宣告式那層是多餘的。
# 一起消失的坑：
#   - 相依關係被迫寫成布林運算式（install_build_tools = install_go or install_python）
#   - `-e install_go=false` 傳進來是字串 "false"，`when:` 看得懂但 Jinja `{% if %}`
#     一律 truthy，少寫 `| bool` 就會裝出「Go 沒裝但 PATH 有 Go」
#   - tag 與開關不同步（`TAGS=go` 不帶 profile）
#
# 代價（明確記著）：**沒有「一句話把這台機器收斂回我要的組合」了**。以前讀 group_vars
# 就知道這台該有什麼；現在得自己記得裝過哪些，或用不帶 TAGS 的 `make install` 暴力全裝。
# `make list` 會偵測機器上實際有什麼來補這個缺口。

# Go 的目標版本。'latest' 表示「每次 install 都查 go.dev」，會跟著上游走版；要凍住就
# pin 成 '1.26.5' 這種。
#
# 註：「每個專案不同版本」不需要版本管理器 —— Go 1.21+ 預設 GOTOOLCHAIN=auto，go.mod
# 要求更新的版本時 go 指令會自動下載並改用對應 toolchain。這裡只裝一個 bootstrap Go。
go_version: latest

# Node 的目標版本。**明確 pin，刻意不支援 'latest'** —— 這點跟 go_version 相反，理由是
# 兩者的上游模型不同：Go 只有一條線，latest 永遠是「該用的那個」；Node 是奇數版
# （25 / 27…）不進 LTS、只活半年，追 latest 會定期把機器推到非 LTS 上。
#
# 24.18.0 = active LTS（Krypton）。要換版就改這裡，然後 `make install TAGS=node`。
#
# 註：「每個專案不同版本」在這裡不需要版本管理器 —— 前端專案宣告的幾乎都是**地板**
# （例：vite 8 要 ^20.19 || >=22.12），一個 LTS 就蓋過去了。真的出現硬衝突時，隔離
# 該待在專案層（那個專案自己的 devcontainer），不是機器層。nvm / fnm 另外還有硬傷：
# 它們是 shell function，非互動 shell 拿不到 node，詳見 node.yml 檔頭。
node_version: "24.18.0"

# netavark 的 firewall driver —— **一律明寫，不吃發行版預設**。
#
# 為什麼不吃預設：netavark 的預設是「編譯期」決定的（上游 src/firewall/mod.rs 用
# `#[cfg(default_fw = ...)]`，runtime 偵測 firewalld 那段是被註解掉的），所以同一版
# netavark 在不同發行版預設可能不同。Ubuntu 26.04 的 netavark 1.16.1 實測是 nftables
# （`netavark version` 會直接印 `default_fw_driver`），Debian changelog 也兩次寫明
# 「Default to nftables, again」。依賴這種東西 = 換台機器行為就變。
#
# WSL2 上 nftables driver 會壞（WSL kernel 沒編 CONFIG_NFT_FIB_IPV6，詳見 CLAUDE.md），
# 故走 iptables；其他 host 用 nftables（發行版的方向，批次下規則較快，也不必裝 iptables）。
# 可用值：iptables / nftables / firewalld / none，或 '' 表示「完全不管，用發行版預設」。
# 這裡引用 detect.yml 設的 is_wsl —— Ansible 變數延遲求值，podman.yml 用到時已經存在。
podman_firewall_driver: "{{ 'iptables' if is_wsl else 'nftables' }}"

# 反安裝時要不要連「資料」一起清（模組快取、build cache、uv 裝的 Python runtime…）。
# 預設 false —— `make uninstall TAGS=go` 只拿掉工具本身，資料留著並報告大小；要一起清是
# `make uninstall TAGS=go DATA=1`。
#
# 為什麼預設保留：那些目錄常常混著你自己的東西，最典型是 `~/go` —— `go install` 裝的
# 二進位（bin/）跟模組快取（pkg/mod）在同一棵樹底下，沒辦法只刪一半又講得清楚。
# 「拿掉工具」與「丟掉資料」是兩個決定，不該由同一個字觸發。
#
# 註：`~/.claude` 不受這個開關影響，任何情況下都保留（設定 / 專案紀錄 / memory 是資料，
# 不是這個 role 裝的東西）。
#
# 這是唯一一個從指令列傳進來的布林，所以用到的地方**一律要 `| bool`** —— `-e` 傳進來
# 是字串 "true"/"false"，兩者在 Jinja 裡都 truthy（見 uninstall.yml 那條註解）。
dev_env_uninstall_data: false

# 註：SSH key 與 git 身分不在這個 role —— 由 wsl-bootstrap 的 provision.sh 在 bring-up 就
# 備好（key 得先在才能 clone 私有 repo，屬「一台個人機」而非軟體層）。設定在 config.ps1。
# 例外是**之後**才多出來的 git 網域：`make ssh-host HOST=<網域>`，參數擺在 ssh-host.yml
# 那個入口的 vars（它們是「這一次執行的參數」，不是這台機器的組態，所以不放這裡）。
