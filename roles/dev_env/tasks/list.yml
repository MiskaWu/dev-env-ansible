---
# `make list` 專用：印出「有哪些可裝的項目、這台機器上已經有哪些」。
# tag 是 [list, never] —— `never` 保證一般的 install 絕不會跑到它（包含不帶 TAGS 的
# 全裝），要跑只能明確 `--tags list`。整個檔唯讀（stat、debug，與選填的 `--version`
# 查詢）。
#
# ---- 這個檔的角色 ------------------------------------------------------------
# 布林開關 2026-07-28 移除後，沒有任何地方記著「這台機器該有什麼」—— 所以它印的 ✓／·
# 是**當場 stat 出來**的實機狀態。這正是拿掉宣告式那層之後留下的缺口，由這裡補上。
#
# 仍然手寫的只有下面那份 loop 清單（tag、說明、偵測路徑）。**往 main.yml 加一個 import
# 時記得回來補一筆**；tag 有沒有漏不必擔心，`make list` 結尾會直接跟 playbook 要一次
# 真實的 tag 清單。
#
# 刻意**不列舉 base 那四個套件的名字**：那是 base.yml 裡的字面值、這裡讀不到，抄過來
# 就會漂移（jq 2026-07-27 升格時，這行原本抄的三個名字當場過期）。
#
# 偵測路徑挑「裝完一定會出現的檔案」。三個用代理：build-tools 是 metapackage、沒有自己
# 的檔案，用 /usr/bin/gcc；base 是一組套件，用其中最專屬的 /usr/bin/jq；playwright 用
# 字型檔而不是它裝的任何一個 .so，兩個理由 ——
#   1. 那批 .so 少了會讓 chromium 當場起不來（大聲），字型少了卻是**靜默**的：測試全綠、
#      只有截圖裡的中文變成豆腐。偵測要對準看不見的那個。
#   2. .so 的路徑帶 arch（/usr/lib/x86_64-linux-gnu/…），字型檔的不帶。
#
# 選填的 `version`：登記了就在 ✓ 底下多印一行 `<偵測路徑> <version>` 的輸出第一行。只給
# 「有沒有」分不出好壞的項目用 —— 目前只有 gh：官方套件庫的新版與 Ubuntu universe 那支
# 已經壞掉的 2.46 都是 /usr/bin/gh，光打勾看不出是哪一支。
- name: 偵測已裝的項目
  ansible.builtin.stat:
    path: "{{ item.path }}"
  register: _list_probe
  check_mode: false
  loop:
    - tag: claude
      dep: false
      path: "{{ ansible_facts.env.HOME }}/.local/bin/claude"
      desc: Claude Code —— 這個 repo 的存在理由
    - tag: go
      dep: false
      path: /usr/local/go/bin/go
      desc: Go {{ go_version }}（GOTOOLCHAIN=auto 管專案版本，不需要版本管理器）
    - tag: python
      dep: false
      path: "{{ ansible_facts.env.HOME }}/.local/bin/uv"
      desc: uv（自己也管 Python 版本，所以不需要 pyenv）
    - tag: node
      dep: false
      path: /usr/local/node/bin/node
      desc: Node.js {{ node_version }} LTS + npm（官方 tarball，不需要 nvm）
    - tag: rust
      dep: false
      path: "{{ ansible_facts.env.HOME }}/.cargo/bin/rustup"
      desc: >-
        Rust stable + rustfmt / clippy（官方 rustup；專案版本由 rust-toolchain.toml 管）
    - tag: playwright
      dep: false
      path: /usr/share/fonts/truetype/wqy/wqy-zenhei.ttc
      desc: >-
        headless 瀏覽器的系統相依（.so + 中文字型；Playwright 本身與瀏覽器歸專案端）
    - tag: podman
      dep: false
      path: /usr/bin/podman
      desc: >-
        rootless Podman + DOCKER_HOST（firewall driver:
        {{ podman_firewall_driver | default('', true) | ternary(podman_firewall_driver, '發行版預設') }}）
    - tag: lazygit
      dep: false
      path: /usr/bin/lazygit
      desc: lazygit（git 的 TUI）
    - tag: glab
      dep: false
      path: /usr/bin/glab
      desc: >-
        glab（GitLab CLI；工作管理的 issue／MR 走它，裝完要自己 glab auth login）
    - tag: gh
      dep: false
      path: /usr/bin/gh
      version: --version
      desc: >-
        gh（GitHub CLI 官方套件庫 —— Ubuntu 的 2.46 已壞；裝完要自己 gh auth login）
    - tag: git-lfs
      dep: false
      path: /usr/bin/git-lfs
      desc: >-
        git-lfs（沒裝不會報錯 —— clone 拿到的是 pointer，commit 會把大檔直接塞進 git）
    - tag: ffmpeg
      dep: false
      path: /usr/bin/ffmpeg
      desc: >-
        ffmpeg（合成 MP4：H.264 + AAC；Playwright 附的那支只有 VP8／WebM）
    - tag: fonts-cjk
      dep: false
      path: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
      desc: >-
        Noto Sans CJK（日文用日文字形、繁中用繁中字形；playwright 的文泉驛只有一種字形）
    - tag: unzip
      dep: false
      path: /usr/bin/unzip
      desc: unzip（不少 release 只出 zip）
    - tag: base
      dep: true
      path: /usr/bin/jq
      desc: claude / uv / rustup 的 installer 相依（清單見 base.yml）
    - tag: build-tools
      dep: true
      path: /usr/bin/gcc
      desc: build-essential —— Go cgo / uv C extension / rustc linker 的前置
  loop_control:
    label: "{{ item.tag }}"

# 只對「裝了、而且登記了 version」的項目跑。failed_when: false —— 版本讀不出來不該讓
# 唯讀的 make list 失敗，頂多少印那一行。
- name: 讀版本（有登記 version 的項目）
  ansible.builtin.command:
    argv: ["{{ item.item.path }}", "{{ item.item.version }}"]
  register: _list_version
  changed_when: false
  failed_when: false
  check_mode: false
  when: item.stat.exists and item.item.version is defined
  loop: "{{ _list_probe.results }}"
  loop_control:
    label: "{{ item.item.tag }}"

# 只 loop `_list_version.results` 一份：它是對 `_list_probe.results` 逐項跑出來的，每個
# 元素同時帶著探測結果（r.item.stat / r.item.item）與版本輸出。被 when 跳過的元素沒有
# stdout_lines，所以一律 `| default([])`。（同 uninstall.yml「移除完成」那段的單一 loop。）
- name: 可安裝項目一覽
  ansible.builtin.debug:
    msg: |-
      可安裝的項目（✓ 這台機器上已經有 / · 還沒裝）
      {% for r in _list_version.results | rejectattr('item.item.dep') %}

        {{ '✓' if r.item.stat.exists else '·' }} {{ r.item.item.tag.ljust(12) }} {{ r.item.item.desc }}
      {%- for v in (r.stdout_lines | default([]))[:1] %}

                       {{ v }}
      {%- endfor %}
      {%- endfor %}


      相依層 —— 上面的項目會自動帶進來，很少需要自己點：
      {% for r in _list_version.results | selectattr('item.item.dep') %}

        {{ '✓' if r.item.stat.exists else '·' }} {{ r.item.item.tag.ljust(12) }} {{ r.item.item.desc }}
      {%- endfor %}


      怎麼用：
        make install TAGS=claude      裝一項
        make install TAGS=go,python   裝多項，一次 ansible run 做完
        make install                  全裝（不帶 TAGS 就是不帶 --tags）
        make check TAGS=podman        乾跑預覽這一項會改什麼
        make uninstall TAGS=go        移除一項（必須點名，不帶 TAGS 會被拒絕）

      相依是自動的：TAGS=python 會把 base 與 build-tools 一起帶進來，任何會影響 PATH
      的項目也都會順便更新 ~/.profile —— 不必自己列。

      移除只支援 tarball / installer 裝的項目（claude / go / python / node / rust）——
      那幾個是這個 role 獨佔一整個目錄的，刪掉不牽動別的東西。apt 裝的（podman /
      playwright / lazygit / glab / gh / git-lfs / ffmpeg / fonts-cjk / unzip / base / build-tools）要手動，
      `make uninstall TAGS=<那些>` 會印出該怎麼做與為什麼。加 DATA=1 可以連快取 / 模組一起清。
