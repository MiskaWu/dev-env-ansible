---
# 這個檔分兩塊，界線刻意畫清楚：
#
#   core packages —— 不裝就沒辦法把這台機器準備起來的東西。無條件裝、沒有開關。
#                    判準是「Claude Code 的 installer 與取得這個 repo 需要什麼」，
#                    不是「什麼好用」。三個就到頂了，不要往這裡加東西。
#   dev_env_packages —— 個人選裝，內容在 defaults/main.yml，改清單就好。
#
# 已移除 gnupg / lsb-release —— 兩者都只在「加第三方 apt repo」時才需要（gnupg 驗 repo
# 簽章金鑰、lsb-release 拿 codename 組 sources.list）。現在全走 Ubuntu 內建源 + 官方
# installer，沒有第三方 repo。apt 驗官方源用的是相依帶進來的 gpgv，不是 gnupg。
- name: Install core packages
  become: true
  ansible.builtin.apt:
    name:
      - ca-certificates    # CA 根憑證庫；curl / git 走 HTTPS 驗對方憑證用
      - curl               # Claude Code 的官方 installer 靠它
      - git                # 取得這個 repo 與之後 git pull 更新
    update_cache: true
    cache_valid_time: 3600

# 一次全丟給 apt（不是 loop 一個個裝）：解相依只算一次，也只更新一次 cache。
- name: Install selected CLI packages
  become: true
  ansible.builtin.apt:
    name: "{{ dev_env_packages }}"
    update_cache: true
    cache_valid_time: 3600
  when: dev_env_packages | length > 0

# 編譯工具鏈自成一項，不混進上面的清單 —— 它是 Go（cgo）與 uv（C extension）共用的
# 前置，不是日常會敲的工具。理由與體積取捨寫在 defaults/main.yml 的 install_build_tools。
- name: Install build toolchain
  become: true
  ansible.builtin.apt:
    name: build-essential
    update_cache: true
    cache_valid_time: 3600
  when: install_build_tools | bool
