---
# 基礎 apt 套件 —— **這是別人的相依，不是「基本必裝」**。它掛在 `[base, claude, python,
# rust]` 底下（見 main.yml），所以 `make install TAGS=claude` 會自動把它帶進來，跟
# build-tools 被 go / python / rust 帶進來是完全一樣的手法。
#
# 為什麼是這四個 tag：`claude.yml`、`python.yml`、`rust.yml` 都是 `curl … | sh` 跑官方
# installer，三者都要 `curl` + `ca-certificates`；`jq` 只有 Claude 的 installer 用得到（見下）。
# rustup 那條的證據：task 本身就是 `curl … https://sh.rustup.rs | sh`，而 rustup-init.sh 的
# `downloader()` 也是先找 curl（沒有才退 wget）去抓真正的 rustup-init 二進位。
# `go.yml` 走 ansible 的 `get_url`（Python 端發 HTTPS，不呼叫 curl 二進位），所以沒掛 go。
#
# 判準是「某個 installer 的必經路徑上真的用得到什麼」，不是「什麼好用」。四個就到頂了 ——
# 要加就拿出「在原始碼裡指得出它被呼叫」等級的證據（jq 就是這樣進來的，ripgrep 是這樣被
# 擋掉的，見 CLAUDE.md）。
#
# 已移除 gnupg / lsb-release —— 兩者都只在「加第三方 apt repo」時才可能需要（gnupg 把
# ASCII 金鑰 dearmor 成 keyring、lsb-release 拿 codename 組 sources.list）。apt 驗簽章用的是
# 相依帶進來的 gpgv，不是 gnupg。2026-10-05 有了第一個第三方 repo（gh.yml，GitHub CLI
# 官方套件庫），兩者照樣用不到：官方給的就是二進位 keyring、suite 是固定的 `stable`。
#
# jq 是 2026-07-27 從選裝清單升上來的，兩個理由都是實測來的，不是「好用」：
#
#  1. installer 真的會用它。抓下 https://claude.ai/install.sh 看：拿 manifest.json 的
#     checksum 時分兩條路，有 jq 走 `jq -r .platforms[$platform].checksum`，沒有就退回
#     `get_checksum_from_manifest()` 用 bash regex 硬解，而那個 regex 靠
#     `"$platform"[^}]*"checksum"` —— 假設兩個 key 之間不會出現 `}`。上游哪天在 platform
#     物件裡多包一層，regex 就靜默抓不到 → checksum 為空 → installer 中止，而印出來的是
#     誤導的 "Platform linux-x64 not found in manifest"（platform 明明在裡面）。
#     **checksum 驗證兩條路都會做，所以這不是安全問題**，是「上游改格式就炸、且錯誤訊息
#     看不懂」的問題 —— 跟 podman 那堆 Recommends 是同一類地雷：少了不會當場報錯。
#     順序上 main.yml 是 base.yml → claude.yml，所以掛同一個 tag 就保證 installer 跑到
#     時它已經在了。
#
#  2. statusline 這種每次重繪都跑的熱路徑，jq 快一個檔次。同機實測（60 次平均）：
#     單一 jq 一次抽完 10 個欄位 4.6ms，python3 做同一件事 32.4ms —— 光 interpreter
#     啟動就吃掉 21.5ms，jq 只要 4.9ms。
#     注意「7 個 jq pipe 比一個 python3 慢」那個說法是稻草人：7 次 jq 確實要 29.3ms，
#     但根本不必呼叫 7 次，`jq -r '[...]|@tsv'` 一次就抽完。
- name: Install base packages
  become: true
  ansible.builtin.apt:
    name:
      - ca-certificates    # CA 根憑證庫；curl / git 走 HTTPS 驗對方憑證用
      - curl               # Claude Code / uv / rustup 的官方 installer 都靠它
      - git                # 取得這個 repo 與之後 git pull 更新（bring-up 已給，這裡是保險）
      - jq                 # Claude installer 解 manifest checksum 的首選路徑（見上方註解）
    update_cache: true
    cache_valid_time: 3600
