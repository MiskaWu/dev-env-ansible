---
# Codex CLI —— OpenAI 官方的 coding agent CLI，走官方獨立安裝程式（standalone installer）。
# 起因（2026-11-06）：要讓 Claude 透過 `codex exec` 用 ChatGPT 額度生圖，底層規定只能是
# 官方 `codex` 執行檔，所以它是機器層的工具，不是某個專案的相依。
#
# ---- 為什麼不用 npm ------------------------------------------------------------
# 上游三條路（install.sh / npm / Homebrew）裡，獨立安裝程式跟 claude.yml 同形狀，而且：
#   - 不需要 Node。走 npm 就得掛 `node` tag，只為了放一支原生執行檔。
#   - 實測 npm 全域的 /usr/local/node 是 root 的，一般使用者 `npm i -g` 會失敗。
# 體積不是理由：0.167.0 實測 npm 版 438MB、獨立安裝 516MB，後者反而大。
#
# ---- 釘版本，不追 latest --------------------------------------------------------
# 生圖流程的驗證結果綁定 Codex 版本（生圖能力與 `exec` 的 JSONL 都還在變），升版要重測，
# 所以版本是一個要人決定的動作：改 defaults 的 `codex_version`，再 `make install TAGS=codex`。
# 判斷要不要裝看 `codex --version`，不用 `creates:` —— 那樣改了版本號也不會升級（同 node.yml）。
#
# ---- 登入不由這個 role 做 ------------------------------------------------------
# `codex login` 要瀏覽器，token 落在 ~/.codex/auth.json，同 glab / gh 歸使用者自己。
#
# 用 curl 跑 installer，所以掛 base（main.yml 那行）。pipefail 的理由見 claude.yml。
- name: Check installed Codex version
  ansible.builtin.command: "{{ ansible_facts.env.HOME }}/.local/bin/codex --version"
  register: _codex_current
  changed_when: false
  failed_when: false
  check_mode: false

# 三個環境變數都有理由，別當雜訊刪掉：
#   CODEX_RELEASE          釘版本；同時讓 installer 不留 auto-update-version 這個檔。
#   CODEX_NON_INTERACTIVE  不設的話，有 tty 時結尾會問「Start Codex now?」，ansible 就卡住。
#   PATH                   installer 的 add_to_path 發現 ~/.local/bin 不在 PATH 上，就會往
#                          ~/.bashrc 加一段自己的區塊。乾淨機器第一次跑時正是這個情況，
#                          而 PATH 這裡只歸 profile.yml 管（同 rust.yml 的 --no-modify-path），
#                          所以先放進去，讓它走「已經在 PATH 上」那條路，不碰任何 rc 檔。
- name: Install Codex CLI {{ codex_version }} (official standalone installer)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      curl -fsSL https://chatgpt.com/codex/install.sh | sh
    executable: /bin/bash
  environment:
    CODEX_RELEASE: "{{ codex_version }}"
    CODEX_NON_INTERACTIVE: "1"
    PATH: "{{ ansible_facts.env.HOME }}/.local/bin:{{ ansible_facts.env.PATH }}"
  when: (_codex_current.stdout | default('') | trim) != ('codex-cli ' + codex_version)

# --- symlink 進 /usr/local/bin -------------------------------------------------
# 理由同 claude.yml：`~/.profile` 只有登入 shell 會讀，而 codex 常被腳本呼叫。
# 指向 ~/.local/bin/codex（installer 維護的穩定入口），不要指向 releases/<版本>。
- name: Check Codex binary is in place
  ansible.builtin.stat:
    path: "{{ ansible_facts.env.HOME }}/.local/bin/codex"
  register: _codex_bin
  check_mode: false

# when 是為了 `--check`：乾跑不會真的裝，來源不存在時 file: state=link 會報錯。
- name: Symlink Codex into /usr/local/bin
  become: true
  ansible.builtin.file:
    src: "{{ ansible_facts.env.HOME }}/.local/bin/codex"
    dest: /usr/local/bin/codex
    state: link
  when: _codex_bin.stat.exists
