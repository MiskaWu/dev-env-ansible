---
# WSL-only 的 task 靠這個 fact gate 起來，讓這個 role 能跨用到非 WSL 的 Linux host。
- name: Detect environment
  ansible.builtin.set_fact:
    is_wsl: "{{ ('microsoft' in ansible_facts.kernel | lower) or ('wsl' in ansible_facts.kernel | lower) }}"
    # Debian 風格的架構名（amd64 / arm64）：Go tarball 用這個拼法。注意上游各家拼法
    # 不一致（有 x86_64 / aarch64、也有 x64），要用時先確認，別直接套這個 fact。
    dev_env_arch: "{{ 'arm64' if ansible_facts.architecture == 'aarch64' else 'amd64' }}"

# uid / user 不另外跑 `id -u` —— gather_facts 已經給了 ansible_facts.user_uid 與
# ansible_facts.user_id，兩者都是「ansible 實際連進去的那個 user」，正是我們要的。
- name: Environment summary
  ansible.builtin.debug:
    msg: >-
      host={{ inventory_hostname }} kernel={{ ansible_facts.kernel }}
      arch={{ ansible_facts.architecture }} is_wsl={{ is_wsl }}
      user={{ ansible_facts.user_id }} uid={{ ansible_facts.user_uid }}
