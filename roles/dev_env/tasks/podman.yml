---
- name: Install Podman and rootless dependencies
  become: true
  ansible.builtin.apt:
    name: [podman, buildah, skopeo, uidmap, slirp4netns, fuse-overlayfs]
    update_cache: true
    cache_valid_time: 3600

# --- WSL2-only：netavark 預設的 nftables driver 在 WSL2 kernel 上失敗，
#     會弄壞每一個 compose bridge network。改用 iptables driver（xtables-nft 相容層）。
- name: Install iptables (WSL2 netavark driver)
  become: true
  ansible.builtin.apt:
    name: iptables
  when: is_wsl

- name: containers.conf — iptables firewall driver
  become: true
  ansible.builtin.copy:
    dest: /etc/containers/containers.conf
    mode: "0644"
    content: |
      [network]
      firewall_driver = "iptables"
  when: is_wsl

# --- WSL2-only：WSL 的 `/` 是 private mount propagation（正常 systemd 系統開機時會把
#     根設成 shared，WSL 沒做）。rootless podman 會警告
#     `"/" is not a shared mount, ... missing mounts with rootless containers`，
#     且容器內的 mount 傳播可能不正確（對 k3s 這種大量 mount 的東西特別有影響）。
#     用開機早期的 oneshot systemd unit 把 / 設成 rshared，一勞永逸。
- name: WSL — systemd unit 讓 / 在開機時變 rshared（rootless podman 需要）
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/system/rshared-root.service
    mode: "0644"
    content: |
      [Unit]
      Description=Make / a shared mount for rootless podman (WSL leaves it private)
      DefaultDependencies=no
      After=local-fs.target
      Before=sysinit.target
      [Service]
      Type=oneshot
      ExecStart=/usr/bin/mount --make-rshared /
      RemainAfterExit=yes
      [Install]
      WantedBy=sysinit.target
  when: is_wsl
  register: _rshared_unit

- name: WSL — enable rshared-root.service
  become: true
  ansible.builtin.systemd_service:
    name: rshared-root.service
    enabled: true
    daemon_reload: "{{ _rshared_unit is changed }}"
  when: is_wsl

# Ubuntu 完全不出貨 registries.conf，內建 short-name 別名表也沒有 postgres/redis/nats。
- name: registries.conf — docker.io unqualified search
  become: true
  ansible.builtin.copy:
    dest: /etc/containers/registries.conf
    mode: "0644"
    content: |
      unqualified-search-registries = ["docker.io"]
      short-name-mode = "disabled"

- name: Enable linger so rootless services run without an active login
  become: true
  ansible.builtin.command: "loginctl enable-linger {{ ansible_facts.user_id }}"
  args:
    creates: "/var/lib/systemd/linger/{{ ansible_facts.user_id }}"

- name: Install docker-compose shim binary
  become: true
  ansible.builtin.get_url:
    url: "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-{{ ansible_facts.architecture }}"
    dest: /usr/local/bin/docker-compose
    mode: "0755"
  when: compose_shim

# 用「建 enable symlink」啟用 podman.socket，而不是 systemctl --user enable。
# 為什麼：WSL 上 systemd 259 的 user session 冷啟動有 race，`systemctl --user` 常
# 連不上 user bus（Failed to connect to user scope bus）而讓整個 play abort。
# enable 的本質就是在 sockets.target.wants 建一個指向 unit 的 symlink——不需要 live
# 的 user manager。enable 後，下次乾淨 session（distro 重啟）sockets.target 就會拉起它。
# 啟動則 best-effort，race 擋住也不致命。
- name: Ensure user systemd sockets.target.wants dir
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.config/systemd/user/sockets.target.wants"
    state: directory
    mode: "0755"

- name: Enable rootless podman.socket (symlink; no running user manager needed)
  ansible.builtin.file:
    src: /usr/lib/systemd/user/podman.socket
    dest: "{{ ansible_facts.env.HOME }}/.config/systemd/user/sockets.target.wants/podman.socket"
    state: link

- name: Start podman.socket now (best-effort; WSL cold-start race may defer to next login)
  ansible.builtin.command: systemctl --user start podman.socket
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ login_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ login_uid }}/bus"
  register: _podman_sock
  changed_when: false          # best-effort 啟動不算變更（enable 的 symlink 才是）
  failed_when: false

# 環境變數放 ~/.profile（.bashrc 對非互動 shell 提早 return，讀不到）。
- name: DOCKER_HOST in ~/.profile
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts.env.HOME }}/.profile"
    line: 'export DOCKER_HOST="unix:///run/user/$(id -u)/podman/podman.sock"'
    create: true

# 使用者只用 podman，不要 alias docker=podman（避免 docker/podman 同名混淆）。
# state: absent —— 套用時主動移除 .bashrc 裡那行（不只是不再加）。
# 註：DOCKER_HOST 保留（指向 podman socket），compose 仍走 `podman compose`（用
# docker-compose 二進位當 provider）與需要 Docker API 的工具（IDE / testcontainers）。
- name: Remove docker=podman alias from ~/.bashrc（只用 podman）
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts.env.HOME }}/.bashrc"
    line: "alias docker=podman"
    state: absent
