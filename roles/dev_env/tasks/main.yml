---
# 「這次要裝什麼」由 **tag** 決定，沒有布林開關（2026-07-28 整組移除）。使用者端是
# `make install TAGS=<項目>`；不帶 TAGS 就是全部。
#
# **沒有「無條件裝」的東西了** —— 連 Claude Code 都是一個要點名的 tag。這個 repo 的
# 定位（協助準備 Claude 環境）表現在 `make init` 的指引與 `make list` 的排序上，不表現
# 在「偷偷幫你裝」。真正基礎到不能選的只有 ansible 本身，那個歸 Makefile 的 `make init`。
#
# ---- 相依關係用 tag 表達 -----------------------------------------------------
# 一個 task 檔要成為某個目標的前置，就把那個目標的 tag 也掛上去。兩個現役例子：
#
#   base.yml        [base, claude, python]     ← claude / uv 的 installer 要 curl、jq
#   build-tools.yml [build-tools, go, python]  ← Go 的 cgo、uv 的 C extension 要編譯器
#
# 於是 `--tags claude` 自動帶 base、`--tags python` 自動帶 base + build-tools。
# 實測（--list-tasks）確認過。比布林運算式好在：多一個消費者只要多掛一個 tag，不必回頭
# 改 `install_build_tools: "{{ install_go or install_python }}"` 那種式子；也不會再有
# `-e install_go=false` 傳字串 "false" 進 Jinja 被當成 truthy 的那類坑。
#
# ---- 加東西的規矩 ------------------------------------------------------------
# 新增一個 import 時：(1) 給它自己的 tag；(2) 它需要什麼，就把它的 tag 掛到那些前置的
# import 上；(3) 如果它會影響 PATH / 環境變數，把 tag 也加到最下面 profile.yml 那行；
# (4) 回 list.yml 補一行。

- name: 偵測環境（is_wsl / arch）
  ansible.builtin.import_tasks: detect.yml
  tags: always

# 只給 `make list` 用，什麼都不改。`never` 讓它不會被一般的 install 掃到（包含不帶
# TAGS 的全裝），唯一的進入方式是明確 `--tags list`。放在 detect 之後是因為它要印
# podman_firewall_driver，而那個預設值引用 detect 設的 is_wsl。
- name: 可安裝項目一覽（唯讀）
  ansible.builtin.import_tasks: list.yml
  tags: [list, never]

# ---- 相依層：不會單獨去點，靠上面的 tag 被帶進來 -----------------------------
# 也可以單獨要（`make install TAGS=base` / `TAGS=build-tools`），偶爾有用。
- name: 基礎套件（claude / uv 的 installer 相依）
  ansible.builtin.import_tasks: base.yml
  tags: [base, claude, python]

- name: 編譯工具鏈（Go cgo / uv C extension 的前置）
  ansible.builtin.import_tasks: build-tools.yml
  tags: [build-tools, go, python]

# ---- 可安裝的項目 -------------------------------------------------------------
- name: Claude Code
  ansible.builtin.import_tasks: claude.yml
  tags: [claude]

# ---- CLI 小工具：一個工具一個檔，各自掛 [tools, <自己>] -----------------------
# 兩種叫法都成立：`TAGS=lazygit` 只裝那一個，`TAGS=tools` 是「這一類整包」。
#
# 2026-07-28 從單一 tools.yml 拆開。原本合在一個檔是為了「不要為一句 apt install 開
# 一個檔 + 一個布林 + main.yml 一筆」，但**布林開關同一天就整組移除了**，代價只剩下
# 「一個檔 + 一行 import」—— 那就沒有理由讓這幾個跟 go / node / python 用不同的形狀。
#
# 判準仍然不變：這裡放的是「你自己會敲的東西」。**別人的相依不放這裡** —— installer
# 需要的進 base.yml，編譯工具鏈進 build-tools.yml（`build-essential` 不是你會敲的工具）。
#
# 2026-07 移除的：postgresql-client / redis-tools（改用 podman run 跑 client）、
# ripgrep（Claude 的 native binary 內嵌了 rg，系統這支只有自己在 shell 敲才會用到）。
- name: unzip
  ansible.builtin.import_tasks: unzip.yml
  tags: [tools, unzip]

- name: lazygit
  ansible.builtin.import_tasks: lazygit.yml
  tags: [tools, lazygit]

- name: Go
  ansible.builtin.import_tasks: go.yml
  tags: [go]

- name: Python（uv）
  ansible.builtin.import_tasks: python.yml
  tags: [python]

# 官方 tarball 裝到 /usr/local/node，沒有版本管理器（理由見 node.yml 檔頭）。
# 不掛 base / build-tools —— tarball 安裝路徑上用不到。
- name: Node.js
  ansible.builtin.import_tasks: node.yml
  tags: [node]

- name: 容器 runtime（podman）
  ansible.builtin.import_tasks: podman.yml
  tags: [podman]

# ---- 收尾 -------------------------------------------------------------------
# 放最後：~/.profile 的內容取決於機器上實際有什麼（PATH 項目、DOCKER_HOST）。
#
# **掛在所有會影響環境變數的 tag 底下**（claude 也算 —— 它裝在 ~/.local/bin），所以
# `make install TAGS=go` 之後 .profile 一定是對的。刻意**不用** always：那會讓
# `make facts` 從唯讀變成會改 ~/.profile。
- name: ~/.profile 環境設定
  ansible.builtin.import_tasks: profile.yml
  tags: [profile, claude, go, python, node, podman]

# 註：SSH keys 與 git 身分不在這個 role —— 已移到 wsl-bootstrap 的 provision.sh
# （bring-up 就備好，且 key 得先在才能 clone 私有 repo）。這個 role 只管軟體。
