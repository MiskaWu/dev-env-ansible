---
- import_tasks: detect.yml
  tags: always

- import_tasks: base.yml
  tags: [base]

- import_tasks: podman.yml
  when: container_runtime == 'podman'
  tags: [podman, runtime]

- import_tasks: go.yml
  tags: [go]

- import_tasks: claude.yml
  tags: [claude]

- import_tasks: node.yml
  when: install_node
  tags: [node]

- import_tasks: python.yml
  when: install_python
  tags: [python, uv]

- import_tasks: clients.yml
  when: install_clients
  tags: [clients]

# 注意：SSH keys 與 git 身分不在這個 role —— 已移到 wsl-bootstrap 的 provision.sh
# （bring-up 就備好，且 key 得先在才能 clone 私有 repo）。這個 role 只管軟體。
