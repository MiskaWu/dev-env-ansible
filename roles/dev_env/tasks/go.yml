---
# PATH（/usr/local/go/bin、$HOME/go/bin）與 GOTOOLCHAIN 由 profile.yml 統一管。
- name: Resolve latest Go version
  ansible.builtin.uri:
    url: https://go.dev/VERSION?m=text
    return_content: true
  register: go_latest
  when: go_version == 'latest'
  check_mode: false

- name: Set Go tag
  ansible.builtin.set_fact:
    go_tag: "{{ go_latest.content.split('\n')[0] if go_version == 'latest' else ('go' + go_version) }}"

- name: Check installed Go version
  ansible.builtin.command: /usr/local/go/bin/go version
  register: go_current
  changed_when: false
  failed_when: false
  check_mode: false

# 冪等關鍵：只有目標版本沒裝時才動（修掉 bash 版每次都 rm -rf 重裝的 wart）。
- name: Install Go {{ go_tag }}
  when: go_tag not in (go_current.stdout | default(''))
  block:
    - name: Download Go tarball
      ansible.builtin.get_url:
        url: "https://go.dev/dl/{{ go_tag }}.linux-{{ dev_env_arch }}.tar.gz"
        dest: "/tmp/{{ go_tag }}.linux-{{ dev_env_arch }}.tar.gz"
        mode: "0644"

    - name: Remove old Go
      become: true
      ansible.builtin.file:
        path: /usr/local/go
        state: absent

    # check mode 沒有真的下載 tarball，解壓會因為找不到來源而讓 dry-run 中止（假陽性）。
    - name: Extract Go to /usr/local
      become: true
      ansible.builtin.unarchive:
        src: "/tmp/{{ go_tag }}.linux-{{ dev_env_arch }}.tar.gz"
        dest: /usr/local
        remote_src: true
      when: not ansible_check_mode

# --- symlink 進 /usr/local/bin -------------------------------------------------
# 理由與實測證據寫在 node.yml 對應的那段（那裡的失敗形狀最有代表性）。一句話：
# **`~/.profile` 只有登入 shell 會讀**，`wsl.exe -e` / systemd unit / cron / 未來的
# `ssh dev '<cmd>'` 都拿不到 /usr/local/go/bin —— 實測 `wsl -d dev -e` 下 `go` 是
# NOT FOUND。/usr/local/bin 則在那些 context 的預設 PATH 裡都有。
#
# **Go 走 symlink 不會弄壞 GOROOT**，這是這裡唯一需要另外驗的一點：go 指令是從自己
# 執行檔的位置回推 GOROOT 的，過程會解 symlink。在只有 symlink 目錄的 `env -i` 環境
# 實測 `go env GOROOT` = /usr/local/go、`GOTOOLCHAIN` = auto，正確。
#
# **守備範圍只有 go 與 gofmt**：`go install` 裝的執行檔落在 $HOME/go/bin，那條路徑非
# 登入 shell 一樣看不到 —— 歸 profile.yml 的 PATH 管，兩者互補。
#
# 放在 block **外面**、`file: state=link` 冪等，理由同 node.yml。
- name: Check Go binaries are in place
  ansible.builtin.stat:
    path: /usr/local/go/bin/go
  register: _go_installed
  check_mode: false

# when 是為了 `--check`（乾跑沒真的解壓，來源不存在會讓 file: state=link 報錯）。
- name: Symlink Go binaries into /usr/local/bin
  become: true
  ansible.builtin.file:
    src: "/usr/local/go/bin/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
  loop: [go, gofmt]
  when: _go_installed.stat.exists

# --- /tmp 收尾 ----------------------------------------------------------------
# 一份 tarball 64MB，而 `go_version: latest` 每次上游走版就多留一份。
#
# 2026-07-28 更正：這段原本寫「WSL 的 /tmp 是磁碟、不是 tmpfs，重開機也不會自己消失」，
# 那是錯的 —— Ubuntu 走 systemd 的 `tmp.mount`，`/tmp` 是 **tmpfs**（實測
# `findmnt -no FSTYPE,SIZE /tmp` = tmpfs 7.8G），所以 `wsl --shutdown` 之後它就沒了。
# 但清它的理由反而更強：tmpfs 是 **RAM-backed**，那 64MB 直接佔記憶體（`df -h /tmp`
# 的用量與 `free` 的 shared 欄對得上），而且同一次開機內每走一版 Go 就多留一份。
#
# 刻意放在上面那個 block **外面**：擺在 block 裡只會清掉「這次剛裝的那一份」，於是之前
# 走版留下的舊 tarball 永遠沒人收 —— 而那才是會累積的那些。放外面等於每次 apply 都做一次
# GC，連 role 加這段之前就躺在 /tmp 的都會被收走。
# 留著沒有加速效果：上面判「要不要裝」是看 `go version` 的輸出，不看 tarball 在不在。
# pattern 綁死 go<版本>.linux-<arch>.tar.gz 這個夠窄的形狀，不會誤掃到別人放在 /tmp 的檔案。
- name: Find leftover Go tarballs in /tmp
  ansible.builtin.find:
    paths: /tmp
    patterns: "go*.linux-{{ dev_env_arch }}.tar.gz"
  register: _go_tarballs
  changed_when: false
  check_mode: false

- name: Remove leftover Go tarballs
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ _go_tarballs.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
