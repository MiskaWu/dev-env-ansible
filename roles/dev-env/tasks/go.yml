---
- name: Resolve latest Go version
  ansible.builtin.uri:
    url: https://go.dev/VERSION?m=text
    return_content: true
  register: go_latest
  when: go_version == 'latest'
  check_mode: false

- name: Set Go tag
  ansible.builtin.set_fact:
    go_tag: "{{ go_latest.content.split('\n')[0] if go_version == 'latest' else ('go' + go_version) }}"

- name: Check installed Go version
  ansible.builtin.command: /usr/local/go/bin/go version
  register: go_current
  changed_when: false
  failed_when: false
  check_mode: false

# 冪等關鍵：只有目標版本沒裝時才動（修掉 bash 版每次都 rm -rf 重裝的 wart）。
- name: Install Go {{ go_tag }}
  when: go_tag not in (go_current.stdout | default(''))
  block:
    - name: Download Go tarball
      ansible.builtin.get_url:
        url: "https://go.dev/dl/{{ go_tag }}.linux-{{ go_arch }}.tar.gz"
        dest: "/tmp/{{ go_tag }}.linux-{{ go_arch }}.tar.gz"
        mode: "0644"

    - name: Remove old Go
      become: true
      ansible.builtin.file:
        path: /usr/local/go
        state: absent

    - name: Extract Go to /usr/local
      become: true
      ansible.builtin.unarchive:
        src: "/tmp/{{ go_tag }}.linux-{{ go_arch }}.tar.gz"
        dest: /usr/local
        remote_src: true

- name: Go PATH in ~/.profile
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts.env.HOME }}/.profile"
    line: 'export PATH="$PATH:/usr/local/go/bin:$HOME/go/bin"'
    create: true
