---
- name: Install DB / cache clients
  become: true
  ansible.builtin.apt:
    name: [postgresql-client, redis-tools]
    update_cache: true
    cache_valid_time: 3600

# NATS CLI 走 go install；creates 保證只裝一次（在目標機上判斷，非 control node）。
- name: Install NATS CLI via go install
  ansible.builtin.command:
    cmd: /usr/local/go/bin/go install github.com/nats-io/natscli/nats@latest
    creates: "{{ ansible_facts.env.HOME }}/go/bin/nats"
  environment:
    PATH: "/usr/local/go/bin:{{ ansible_facts.env.PATH }}"
