---
# 這台 WSL distro 由 wsl-bootstrap 帶到「systemd + sshd + python」狀態後，
# control node 透過 WSL2 mirrored networking 以 SSH 管理它 —— 跟管 k3s 一樣。
#
# ansible_host 填 distro 在 LAN 上可達的位址（mirrored 模式下＝Windows host 的位址）。
# 本機測試時可繞過 inventory：
#   ansible-playbook -i 'localhost,' -c local site.yml -e ssh_key_tag=dev
all:
  hosts:
    dev:
      ansible_host: dev.local        # TODO: 換成實際可達位址
      ansible_user: miskawu
  vars:
    ansible_python_interpreter: /usr/bin/python3
