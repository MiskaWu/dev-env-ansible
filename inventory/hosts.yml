---
# 這個 inventory 只給「control node 遠端管」模式用，也就是 `make install-all LOCAL=0`。
# 預設路徑不是這條：在 distro 內直接 `make install` / `make install-<項目>`
# （LOCAL 預設 1，走 `-i localhost, -c local` 打本機，根本不讀這個檔）。
#
# 走這條之前，目標機要另外有 sshd 與 python3 —— wsl-bootstrap 的 baseline 只保證
# systemd + 預設 user + git + make + git 身分 + SSH keys，這兩個不在裡面。
#
# ansible_host 填 control node 連得到目標的位址。**不要指望 WSL2 mirrored
# networking 幫忙**——mirrored 是讓 Windows 連得到 distro 內的容器 port，不是讓
# LAN 連得進 distro。遠端管理走 Windows OpenSSH 的 ProxyJump，或在 distro 上跑
# Tailscale。（見 CLAUDE.md）
all:
  hosts:
    dev:
      ansible_host: dev.local        # TODO: 換成實際可達位址
      ansible_user: miskawu
  vars:
    ansible_python_interpreter: /usr/bin/python3
